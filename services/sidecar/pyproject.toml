[project]
name = "ivsidecar"
version = "0.0.1"
description = "ImageVault local engine (spike B2: health, library DB, thumbnail and metadata probes)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlite-vec==0.1.9",
  "pyvips[binary]>=3.0",
  "pillow-heif>=1.1",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "numpy>=2", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
ivsidecar = "ivsidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivsidecar"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
