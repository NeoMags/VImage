name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Sidecar lint + tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.32
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check services/sidecar
      - run: uv run ruff format --check services/sidecar
      - name: Tests (schema test with a 20k-asset library)
        working-directory: services/sidecar
        env:
          IV_SCHEMA_N: "20000"
          IV_SCAN_N: "100000"
          IV_REQUIRE_EXIFTOOL: "1"
        run: uv run pytest -q

  ui-packages:
    name: UI packages (types, client, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the committed contract
        # openapi.json itself is checked against the sidecar by tests/test_contract.py (python job)
        run: |
          pnpm --filter @imagevault/shared-types generate:ts
          git diff --exit-code -- packages/shared-types || (echo "::error::src/api.ts is stale: run pnpm generate" && exit 1)
      - run: pnpm typecheck
      - run: pnpm test

  ui-e2e:
    name: UI end-to-end (Chromium + real engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.32
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @imagevault/desktop exec playwright install --with-deps chromium
      - name: First run, gallery, live updates, remove folder
        working-directory: apps/desktop
        env:
          IV_E2E_SHOTS: ${{ runner.temp }}/screens
        run: pnpm e2e --trace off
      - name: Gallery performance, 100,000 synthetic photos (heap limit asserted; frame times recorded)
        working-directory: apps/desktop
        env:
          IV_PERF: "1"
          IV_E2E_SHOTS: ${{ runner.temp }}/screens
        run: pnpm e2e --trace off e2e/perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  rust:
    name: Desktop shell check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Placeholder sidecar folder (resources must exist at compile time)
        run: |
          mkdir -p services/sidecar/dist/ivsidecar && touch services/sidecar/dist/ivsidecar/.keep
          mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html  # UI is built and tested in the ui jobs
      - working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
