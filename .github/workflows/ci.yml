name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Sidecar lint + tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - run: uv run ruff check services/sidecar
      - run: uv run ruff format --check services/sidecar
      - name: Tests (schema test with a 20k-asset library)
        working-directory: services/sidecar
        env:
          IV_SCHEMA_N: "20000"
        run: uv run pytest -q

  rust:
    name: Desktop shell check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Placeholder sidecar folder (resources must exist at compile time)
        run: mkdir -p services/sidecar/dist/ivsidecar && touch services/sidecar/dist/ivsidecar/.keep
      - working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
