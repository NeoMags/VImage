[package]
name = "imagevault"
version = "0.0.1"
edition = "2021"
description = "ImageVault desktop shell"

[lib]
name = "imagevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
